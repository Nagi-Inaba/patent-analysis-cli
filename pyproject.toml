[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "patent-analysis-cli"
version = "0.2.0"
description = "Local-first patent analysis contracts and command-line tools"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "Apache-2.0 AND MIT AND BSD-3-Clause AND 0BSD"
license-files = [
  "LICENSE",
  "src/patent_analysis/renderer/THIRD_PARTY_NOTICES.txt",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Operating System :: Microsoft :: Windows :: Windows 11",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "jsonschema>=4.23",
  "regex==2026.4.4",
]

[project.urls]
Homepage = "https://github.com/Nagi-Inaba/patent-analysis-cli"
Documentation = "https://github.com/Nagi-Inaba/patent-analysis-cli#readme"
Issues = "https://github.com/Nagi-Inaba/patent-analysis-cli/issues"
Source = "https://github.com/Nagi-Inaba/patent-analysis-cli"

[project.scripts]
patent-analysis = "patent_analysis.cli:main"
patent-analysis-mcp = "patent_analysis_mcp.server:main"

[project.optional-dependencies]
inventor = [
  "networkx==3.6.1",
  "numpy==2.4.3",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]
mcp = [
  "mcp==2.2.0",
  "opentelemetry-api>=1.45.1",
  "pyjwt==2.15.1",
  "cryptography>=50.0.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.setuptools.package-data]
patent_analysis = [
  "schemas/*.json",
  "schemas/analysis-spec-v2.schema.json",
  "schemas/analysis-result-v2.schema.json",
  "schemas/analysis-error-v2.schema.json",
  "renderer/*.js",
  "renderer/*.json",
  "renderer/*.gz",
  "renderer/THIRD_PARTY_NOTICES.txt",
  "resources/*.json",
]
